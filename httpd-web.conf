#
# Applicatin Apache2 settings
#


NameVirtualHost *:80

<VirtualHost *:80>
	ServerName create-xml.local
	DocumentRoot "P:/projects/create-xml-file"
	# ServerAlias www.choice.local
	ServerAdmin info@brownpaperbag.co.nz
	ErrorLog "logs/create-xml.local-error.log"
	CustomLog "logs/create-xml.local-access.log" combined

    RewriteEngine off

	RewriteLog "P:/projects/create-xml-file/rewrite.log"
	RewriteLogLevel 0

	<Directory "P:/projects/create-xml-file">
		DirectoryIndex index.php
		Options FollowSymLinks
		AllowOverride All
		AcceptPathInfo On
		order allow,deny
		allow from all
	</Directory>
	
